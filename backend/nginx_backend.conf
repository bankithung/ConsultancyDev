# Nginx configuration for Django Backend

upstream django_backend {
    server 127.0.0.1:8000;
}

upstream django_websocket {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name api.yourdomain.com your-oracle-ip;  # Change this
    
    client_max_body_size 100M;
    
    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # API endpoints
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Admin panel
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: the /ws/ WebSocket proxy was removed along with the real-time
    # messaging feature. There is no longer a daphne process to proxy to.

    # Static files
    location /static/ {
        alias /home/ubuntu/consultancy-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # DELIBERATELY NO /media/ LOCATION.
    #
    # This block used to alias /media/ as a public directory with a 7-day
    # cache. Uploaded documents are passports, financial records and academic
    # transcripts; serving them from the web root would make every one of them
    # readable by anyone who could guess or enumerate a filename — no session,
    # no tenant check.
    #
    # Documents are now written encrypted to PRIVATE_MEDIA_ROOT, which sits
    # outside any served path, and are streamed by an authenticated Django view
    # (/api/documents/<id>/download/) that re-checks the caller's branch scope
    # and decrypts in memory. Do not add a /media/ alias back.
}

