# nginx reverse proxy for console.nexxteducation.in
# Frontend: Next.js on 127.0.0.1:3000 | Backend: gunicorn on 127.0.0.1:8000
#
# Install: cp to /etc/nginx/sites-available/console.nexxteducation.in && ln -s into sites-enabled
# TLS:     certbot --nginx -d console.nexxteducation.in

upstream nextjs_app {
    server 127.0.0.1:3000;
}

upstream django_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.nexxteducation.in;

    # certbot will add the 301 redirect to https automatically.

    client_max_body_size 25M;   # document/avatar uploads

    # ---- Django API (same-origin, so no CORS preflights) ----
    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django static files via whitenoise are served by gunicorn itself,
    # but this path is exposed for admin assets:
    location /static/ {
        alias /opt/consultancy/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # ---- Next.js frontend ----
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
